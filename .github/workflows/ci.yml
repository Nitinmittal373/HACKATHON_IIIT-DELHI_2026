name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job first checks that its folder exists, so CI stays green while the
# app is rebuilt phase by phase and switches itself on once code lands.

jobs:
  backend:
    name: Backend · lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f backend/requirements-dev.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'false'
        run: echo "No backend yet, skipping."
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: ruff check .
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        # The frontend's types are generated from this file; a stale copy would hide a break.
        run: |
          python -m scripts.export_openapi
          if [ -n "$(git status --porcelain ../contracts ../frontend/src/lib/meta.fallback.ts)" ]; then
            echo "::error::API contract out of date: run make contract"
            git diff --stat ../contracts ../frontend/src/lib/meta.fallback.ts
            exit 1
          fi
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        # Tests replay recorded TinyFish responses, so no key is needed.
        run: pytest -q

  frontend:
    name: Frontend · lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'false'
        run: echo "No frontend yet, skipping."
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain src/lib/api-schema.d.ts)" ]; then
            echo "::error::API contract out of date: run make contract"
            git diff --stat src/lib/api-schema.d.ts
            exit 1
          fi
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run typecheck
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run build
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        # Replays the recorded check against a mock API; no backend or key is needed.
        run: npm run e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
