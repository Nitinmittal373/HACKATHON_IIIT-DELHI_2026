name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job first checks that its folder exists, so CI stays green while the
# app is rebuilt phase by phase and switches itself on once code lands.

jobs:
  backend:
    name: Backend · lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f backend/requirements-dev.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'false'
        run: echo "No backend yet, skipping."
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: ruff check .
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend
        run: pytest -q
        env:
          DEMO_MODE: "true"

  frontend:
    name: Frontend · lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'false'
        run: echo "No frontend yet, skipping."
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run typecheck
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
