name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the project or RERA number you checked, if any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for ...
        2. Confirm ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options: ["Search", "Check and Agent Cam", "Report", "API only"]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
