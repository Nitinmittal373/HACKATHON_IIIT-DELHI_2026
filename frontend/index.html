<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeevCheck War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --dark:#13201C; --cream:#F6F3EC; --sand:#EDE7DA; --orange:#B4481A; --amber:#F0A35E;
          --muted:#4A5148; --line:#E2DDD1; --ok:#2B6E4F; --warn:#8A5A00; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--cream); color:var(--dark); font-family:Inter,Arial,sans-serif; }
  header { background:var(--dark); color:var(--cream); padding:20px 32px; display:flex; align-items:center; gap:14px }
  header h1 { font-family:Manrope,Arial,sans-serif; font-weight:800; font-size:28px; margin:0 }
  header p { margin:0; color:#BFCBC4 }
  main { max-width:1200px; margin:0 auto; padding:28px 20px }
  form { display:flex; gap:12px; flex-wrap:wrap }
  input { flex:1; min-width:240px; font-size:18px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:#fff }
  button { font-size:16px; font-weight:600; padding:14px 22px; border:0; border-radius:12px; background:var(--orange); color:#FFF8F0; cursor:pointer }
  button.secondary { background:var(--dark) }
  button:disabled { opacity:.5; cursor:default }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:24px }
  .lane { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; min-height:170px }
  .lane h3 { margin:0 0 6px; font-family:Manrope,Arial,sans-serif; font-size:18px; display:flex; justify-content:space-between }
  .pill { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--sand) }
  .pill.run { background:var(--amber) } .pill.done { background:#CFE6D8 } .pill.err { background:#F3C9B5 }
  .log { font-size:13px; color:var(--muted); max-height:120px; overflow:auto; margin-top:8px }
  .log div { padding:3px 0; border-bottom:1px dashed var(--line) }
  .lane a.live { font-size:13px; color:var(--orange) }
  #result { display:none; margin-top:28px; gap:20px; grid-template-columns:320px 1fr }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px }
  .score { font-family:Manrope,Arial,sans-serif; font-size:72px; font-weight:800; line-height:1 }
  .band { display:inline-block; margin-top:8px; font-weight:700; padding:6px 14px; border-radius:999px; color:#fff }
  ul { padding-left:18px } li { margin:6px 0 }
  .ev { border-top:1px solid var(--line); padding:10px 0; font-size:14px }
  .ev a { color:var(--orange); word-break:break-all }
  .muted { color:var(--muted); font-size:13px }
  pre { white-space:pre-wrap; background:var(--sand); padding:14px; border-radius:12px; font-size:13px }
  @media (max-width:760px){ #result { grid-template-columns:1fr } }
</style>
</head>
<body>
<header>
  <svg width="44" height="44" viewBox="0 0 120 120" aria-label="NeevCheck logo"><rect width="120" height="120" rx="28" fill="#B4481A"/><path d="M26 60 L60 30 L94 60" fill="none" stroke="#FFF8F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 68 L55 80 L78 56" fill="none" stroke="#FFF8F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="90" width="68" height="8" rx="4" fill="#FFF8F0"/></svg>
  <div><h1>NeevCheck</h1><p>CIBIL for builders: check before you book, watch until you move in.</p></div>
</header>
<main>
  <form id="f">
    <input id="q" placeholder="Project name, UP-RERA number or builder name" required>
    <button id="go">Investigate</button>
  </form>
  <div class="grid" id="lanes"></div>

  <section id="result">
    <div class="card">
      <div class="muted">NeevScore (300–900)</div>
      <div class="score" id="score">–</div>
      <div class="band" id="band"></div>
      <p class="muted" id="conf"></p>
      <p><button class="secondary" id="complaintBtn">Draft UP-RERA complaint</button></p>
      <p><button class="secondary" id="watchBtn">Start Watch mode</button></p>
      <p class="muted">Risk indicator based on public records. Not a credit rating or legal advice.</p>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-family:Manrope">Why this score</h2>
      <ul id="reasons"></ul>
      <h2 style="font-family:Manrope">Evidence (every claim has a source)</h2>
      <div id="evidence"></div>
      <pre id="complaint" style="display:none"></pre>
    </div>
  </section>
</main>
<script>
const API = location.origin.startsWith("http") ? location.origin : "http://localhost:8000";
const LANES = {rera:"UP-RERA", news:"News & protests", mca:"Company (MCA)", ibbi:"Insolvency (IBBI/NCLT)", authority:"Land authority dues"};
const BAND_COLOR = {"Low risk":"#2B6E4F","Watch":"#8A5A00","Elevated":"#B4481A","High risk":"#7A1F12"};
let jobId = null;
// Scraped text is untrusted: always escape before putting it in the page
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? esc(u) : "#";

function laneBox(k){
  return `<div class="lane" id="l-${k}"><h3>${LANES[k]} <span class="pill" id="p-${k}">waiting</span></h3>
          <div id="live-${k}"></div><div class="log" id="g-${k}"></div></div>`;
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value;
  document.getElementById("go").disabled = true;
  document.getElementById("result").style.display = "none";
  document.getElementById("lanes").innerHTML = Object.keys(LANES).map(laneBox).join("");
  const r = await fetch(`${API}/api/investigate`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({query:q})});
  if (!r.ok) { alert((await r.json()).detail); document.getElementById("go").disabled = false; return; }
  jobId = (await r.json()).job_id;
  const es = new EventSource(`${API}/api/investigate/${jobId}/events`);
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  es.addEventListener("end", () => { es.close(); loadReport(); });
};
function onEvent(e){
  if (!LANES[e.lane]) return;
  const pill = document.getElementById(`p-${e.lane}`);
  const log = document.getElementById(`g-${e.lane}`);
  if (e.type === "started") { pill.textContent = "running"; pill.className = "pill run"; }
  if (e.type === "done") { pill.textContent = "done"; pill.className = "pill done"; }
  if (e.type === "error") { pill.textContent = "unavailable"; pill.className = "pill err"; }
  if (e.type === "streaming_url") {
    document.getElementById(`live-${e.lane}`).innerHTML = `<a class="live" target="_blank" rel="noopener" href="${safeUrl(e.message)}">Watch the agent's browser live</a>`;
    return;
  }
  const d = document.createElement("div"); d.textContent = e.message; log.prepend(d);
}
async function loadReport(){
  document.getElementById("go").disabled = false;
  const r = await (await fetch(`${API}/api/report/${jobId}`)).json();
  const s = r.score;
  document.getElementById("score").textContent = s.band === "Not enough data" ? "–" : s.score;
  const b = document.getElementById("band"); b.textContent = s.band; b.style.background = BAND_COLOR[s.band] || "#4A5148";
  document.getElementById("conf").textContent = `Confidence: ${Math.round(s.confidence*100)}% of key sources checked` + (r.promoter_name ? ` · Promoter: ${r.promoter_name}` : "");
  document.getElementById("reasons").innerHTML = s.reasons.map(x => `<li><b>${esc(x.code)}</b> ${esc(x.text)}</li>`).join("") || "<li>No red flags found in the sources checked.</li>";
  document.getElementById("evidence").innerHTML = r.evidence.map(x =>
    `<div class="ev">${esc(x.claim)}<br><a href="${safeUrl(x.source_url)}" target="_blank" rel="noopener">${esc(x.source_url)}</a> <span class="muted">· checked ${esc(x.fetched_at.slice(0,10))}</span></div>`).join("") || '<p class="muted">No evidence collected.</p>';
  document.getElementById("result").style.display = "grid";
}
document.getElementById("complaintBtn").onclick = async () => {
  const t = await (await fetch(`${API}/api/report/${jobId}/complaint`)).text();
  const p = document.getElementById("complaint"); p.textContent = t; p.style.display = "block";
};
document.getElementById("watchBtn").onclick = async () => {
  const r = await fetch(`${API}/api/watch/${jobId}`, {method:"POST"});
  const j = await r.json();
  alert(r.ok ? "Watch mode on: TinyFish Monitor will check daily and alert on changes." : j.detail);
};
</script>
</body>
</html>
