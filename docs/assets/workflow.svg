<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="NeevCheck workflow: find the project by name, number, builder, locality, document or QR code; confirm it; the War Room reads six sources in parallel; the NeevScore engine gives a 300 to 900 score with reasons; the report links every point to its source; Sentinel re-checks weekly and alerts only on a change.">
  <title>NeevCheck workflow</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111111; }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #5F5F5F; }
    .b { fill: #111111; font-weight: 600; }
    .n { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .big { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #D9530B; letter-spacing: .04em; }
    .card { fill: #FFFFFF; stroke: #EEEAE6; stroke-width: 1.6; animation-duration: 18s; animation-iteration-count: infinite; }
    .c0 { animation-name: a0; } .c1 { animation-name: a1; } .c2 { animation-name: a2; } .c3 { animation-name: a3; } .c4 { animation-name: a4; } .c5 { animation-name: a5; }
    .chip { fill: #FFE8D6; }
    .row { fill: #FBF9F6; stroke: #EEEAE6; }
    .sel { fill: #FFF5EC; stroke: #F26B1D; }
    .dot { fill: #E0DAD4; } .on { fill: #F26B1D; }
    .bar { fill: #F26B1D; animation-name: fill; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
    .mark { fill: #FFFFFF; stroke: #111111; stroke-width: 2.5; animation: slide 6s ease-in-out infinite; }
    .spin { animation: spin 9s linear infinite; }
    .line { stroke: #E8DDD3; stroke-width: 2.5; fill: none; }
    .loop { stroke: #F26B1D; stroke-width: 2.2; fill: none; stroke-dasharray: 3 8; stroke-linecap: round; animation: dash 1.4s linear infinite; }
    .pk { fill: #F26B1D; offset-path: path('M36 60 L1244 60'); offset-rotate: 0deg; animation: travel 18s linear infinite; }
    @keyframes a0 { 0%, 0% { stroke: #EEEAE6; fill: #FFFFFF; } 3%, 14% { stroke: #F26B1D; fill: #FFF5EC; } 17%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } } @keyframes a1 { 0%, 15% { stroke: #EEEAE6; fill: #FFFFFF; } 18%, 29% { stroke: #F26B1D; fill: #FFF5EC; } 32%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } } @keyframes a2 { 0%, 30% { stroke: #EEEAE6; fill: #FFFFFF; } 33%, 44% { stroke: #F26B1D; fill: #FFF5EC; } 47%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } } @keyframes a3 { 0%, 45% { stroke: #EEEAE6; fill: #FFFFFF; } 48%, 59% { stroke: #F26B1D; fill: #FFF5EC; } 62%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } } @keyframes a4 { 0%, 60% { stroke: #EEEAE6; fill: #FFFFFF; } 63%, 74% { stroke: #F26B1D; fill: #FFF5EC; } 77%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } } @keyframes a5 { 0%, 75% { stroke: #EEEAE6; fill: #FFFFFF; } 78%, 89% { stroke: #F26B1D; fill: #FFF5EC; } 92%, 100% { stroke: #EEEAE6; fill: #FFFFFF; } }
    @keyframes fill { 0% { transform: scaleX(.12); } 100% { transform: scaleX(1); } }
    @keyframes slide { 0%, 15% { transform: translateX(0); } 70%, 100% { transform: translateX(var(--run)); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes travel { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .bar, .mark, .spin, .loop, .pk { animation: none; }
      .mark { transform: translateX(88px); }
      .pk { display: none; }
    }
  </style>
  <rect width="1280" height="440" fill="#FFFFFF"/>
  <path class="line" d="M36 60 L1244 60"/>
  <circle class="pk" r="6"/>
  <text class="m" x="36" y="42">WHAT HAPPENS WHEN A BUYER SEARCHES</text>

  <rect class="card c0" x="36" y="96" width="178" height="250" rx="18"/><circle cx="64" cy="126" r="14" fill="#111111"/><text class="n" x="64" y="131" text-anchor="middle">1</text><text class="t" x="88" y="132">Find it</text><text class="s" x="54" y="162">any way you can</text><rect class="card c1" x="236" y="96" width="178" height="250" rx="18"/><circle cx="264" cy="126" r="14" fill="#111111"/><text class="n" x="264" y="131" text-anchor="middle">2</text><text class="t" x="288" y="132">Confirm</text><text class="s" x="254" y="162">is this your project?</text><rect class="card c2" x="436" y="96" width="178" height="250" rx="18"/><circle cx="464" cy="126" r="14" fill="#111111"/><text class="n" x="464" y="131" text-anchor="middle">3</text><text class="t" x="488" y="132">War Room</text><text class="s" x="454" y="162">six lanes, in parallel</text><rect class="card c3" x="636" y="96" width="178" height="250" rx="18"/><circle cx="664" cy="126" r="14" fill="#111111"/><text class="n" x="664" y="131" text-anchor="middle">4</text><text class="t" x="688" y="132">NeevScore</text><text class="s" x="654" y="162">300–900, with reasons</text><rect class="card c4" x="836" y="96" width="178" height="250" rx="18"/><circle cx="864" cy="126" r="14" fill="#111111"/><text class="n" x="864" y="131" text-anchor="middle">5</text><text class="t" x="888" y="132">Report</text><text class="s" x="854" y="162">proof for every point</text><rect class="card c5" x="1036" y="96" width="178" height="250" rx="18"/><circle cx="1064" cy="126" r="14" fill="#111111"/><text class="n" x="1064" y="131" text-anchor="middle">6</text><text class="t" x="1088" y="132">Sentinel</text><text class="s" x="1054" y="162">weekly re-check</text><rect class="chip" x="54" y="188" width="74" height="24" rx="12"/><text class="m" x="91" y="204" text-anchor="middle">name</text><rect class="chip" x="134" y="188" width="74" height="24" rx="12"/><text class="m" x="171" y="204" text-anchor="middle">number</text><rect class="chip" x="