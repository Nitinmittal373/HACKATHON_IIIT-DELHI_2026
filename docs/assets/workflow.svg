imation-duration:3.90s;transform-origin:454px 252px"/><text class="s" x="454" y="271" font-size="11">Insolvency</text><rect x="454" y="276" width="142" height="5" rx="2.5" fill="#EEEAE6"/><rect class="bar" x="454" y="276" width="142" height="5" rx="2.5" style="animation-duration:4.35s;transform-origin:454px 278px"/><text class="s" x="454" y="297" font-size="11">Land authority</text><rect x="454" y="302" width="142" height="5" rx="2.5" fill="#EEEAE6"/><rect class="bar" x="454" y="302" width="142" height="5" rx="2.5" style="animation-duration:4.80s;transform-origin:454px 304px"/><text class="s" x="454" y="323" font-size="11">News and lenders</text><rect x="454" y="328" width="142" height="5" rx="2.5" fill="#EEEAE6"/><rect class="bar" x="454" y="328" width="142" height="5" rx="2.5" style="animation-duration:5.25s;transform-origin:454px 330px"/><text class="big" x="654" y="226">621</text><text class="s b" x="736" y="224">Watch</text><rect x="654" y="248" width="142" height="10" rx="5" fill="#EEEAE6"/><rect x="654" y="248" width="88" height="10" rx="5" fill="#F26B1D"/><circle class="mark" cx="654" cy="253" r="9" style="--run:88px"/><text class="m" x="654" y="282">300</text><text class="m" x="796" y="282" text-anchor="end">900</text><text class="s" x="654" y="312">R05 · R13 · R11 reasons</text><rect class="row" x="854" y="190" width="142" height="30" rx="8"/><text class="s b" x="864" y="209" font-size="11.5">Registered 09 Aug 2017</text><rect class="row" x="854" y="230" width="142" height="30" rx="8"/><text class="s b" x="864" y="249" font-size="11.5">15 complaints · UP-RERA</text><rect class="row" x="854" y="270" width="142" height="30" rx="8"/><text class="s b" x="864" y="289" font-size="11.5">Read on 25 Oct 2026</text><text class="s" x="854" y="320">source link on every line</text><g class="spin" style="transform-origin:1125.0px 246px"><circle cx="1125.0" cy="246" r="42" fill="none" stroke="#E0DAD4" stroke-width="6"/><path d="M1125.0 204 A42 42 0 0 1 1167.0 246" fill="none" stroke="#F26B1D" stroke-width="6" stroke-linecap="round"/></g><text class="s b" x="1125.0" y="251" text-anchor="middle">7 days</text><text class="s" x="1054" y="320">alerts only on a change</text>

